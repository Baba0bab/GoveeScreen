name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues can be written in English or French. Security vulnerability? Do not open an issue, see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: App version
      description: Paramètres → À propos
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: lamp
    attributes:
      label: Lamp model
      description: Shown on the Lampe page after a search, or in the Govee Home app
      placeholder: "H6008"
  - type: input
    id: display
    attributes:
      label: Display setup
      description: Resolution, refresh rate, HDR on or off, number of monitors, GPU
      placeholder: "3840×2160 60 Hz HDR off + 1920×1080 144 Hz, RTX 4070"
  - type: dropdown
    id: content
    attributes:
      label: What was on screen
      multiple: true
      options: ["Desktop / applications", "Video (browser, player)", "Game in a window or borderless", "Game in exclusive full screen", "Lock screen"]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      render: text
